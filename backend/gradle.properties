# Build versions, in one place. Upgrading = changing a value here.
# Library versions aren't listed: the Spring Boot plugin manages them (they follow springBootVersion).

springBootVersion=4.1.2
dependencyManagementVersion=1.1.7

# Java version the code is compiled and tested with.
# Keep in sync with JAVA_VERSION in the root .env, which picks the Docker images.
javaVersion=17
