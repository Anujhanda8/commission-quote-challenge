# Runs the app as it would be deployed: one container, built from the Dockerfile (all tests run during the build).
#   docker compose up --build      ->  http://localhost:8080
# Settings come from .env.
services:
  app:
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION}
        JAVA_VERSION: ${JAVA_VERSION}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Local setup: the real vendor doesn't exist yet, so turn on the mock and use a local key.
      # A real deployment sets its own VENDOR_API_KEY and leaves the mock off (the default).
      MOCK_VENDOR_ENABLED: "true"
      VENDOR_API_KEY: ${VENDOR_API_KEY:-local-dev-key}
